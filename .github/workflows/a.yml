name: Professional SaaS Screen Recorder3

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "رابط موقع SaaS الذي سيتم فتحه"
        required: true
        default: "https://example.com"
      session_minutes:
        description: "أقصى مدة للجلسة كحماية فقط - ليست مدة التسجيل"
        required: true
        default: "120"
      width:
        description: "عرض شاشة التسجيل"
        required: true
        default: "2560"
      height:
        description: "ارتفاع شاشة التسجيل"
        required: true
        default: "1440"
      fps:
        description: "معدل الإطارات"
        required: true
        default: "60"

permissions:
  contents: read

jobs:
  recorder:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      DISPLAY: ":99"
      WIDTH: ${{ inputs.width }}
      HEIGHT: ${{ inputs.height }}
      FPS: ${{ inputs.fps }}
      SITE_URL: ${{ inputs.site_url }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}
      XCURSOR_SIZE: "64"
      RECORDING_FILE: "${{ github.workspace }}/recording.mp4"
      DIAGNOSTIC_SCREENSHOT: "${{ github.workspace }}/diagnostic-before-recording.png"

    steps:
      - name: Install Recording Stack
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            nginx \
            xdotool \
            x11-utils \
            x11-xserver-utils \
            xcursor-themes \
            adwaita-icon-theme \
            fontconfig \
            fonts-noto-core \
            fonts-noto-ui-core \
            fonts-noto-color-emoji \
            fonts-kacst \
            ffmpeg \
            chromium \
            python3 \
            python3-websocket \
            curl \
            wget \
            openssl \
            ca-certificates

          echo "Installed versions:"
          chromium --version
          ffmpeg -version | head -n 1
          x11vnc -version 2>&1 | head -n 1 || true
          websockify --version 2>&1 || true
          nginx -v

          test -f /usr/share/novnc/vnc.html

      - name: Install Common Tajawal Fallback Fonts
        shell: bash
        run: |
          set -euo pipefail

          FONT_DIR=/usr/local/share/fonts/tajawal
          sudo mkdir -p "$FONT_DIR"

          BASE="https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal"

          for FONT in \
            Tajawal-ExtraLight.ttf \
            Tajawal-Light.ttf \
            Tajawal-Regular.ttf \
            Tajawal-Medium.ttf \
            Tajawal-Bold.ttf \
            Tajawal-ExtraBold.ttf \
            Tajawal-Black.ttf; do
            sudo wget -q "${BASE}/${FONT}" -O "${FONT_DIR}/${FONT}"
          done

          sudo fc-cache -f

          echo "Tajawal system fallback fonts:"
          fc-list | grep -i "Tajawal" | head -n 20 || true

      - name: Prepare Runtime
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/saas-recorder /tmp/chromium-profile
          mkdir -p /tmp/saas-recorder /tmp/chromium-profile
          rm -f "$RECORDING_FILE" "$DIAGNOSTIC_SCREENSHOT"

      - name: Start Virtual Display
        shell: bash
        run: |
          set -euo pipefail

          Xvfb "$DISPLAY" \
            -screen 0 "${WIDTH}x${HEIGHT}x24" \
            -ac \
            +extension GLX \
            +extension RANDR \
            +render \
            -noreset \
            > /tmp/saas-recorder/xvfb.log 2>&1 &

          echo $! > /tmp/saas-recorder/xvfb.pid
          sleep 3

          DISPLAY="$DISPLAY" xrdb -merge <<'XRES'
          Xcursor.theme: Adwaita
          Xcursor.size: 64
          XRES

          DISPLAY="$DISPLAY" xdpyinfo | grep dimensions
          DISPLAY="$DISPLAY" xrandr || true

      - name: Start Chromium
        shell: bash
        run: |
          set -euo pipefail

          export DISPLAY="$DISPLAY"
          export XCURSOR_SIZE="$XCURSOR_SIZE"
          export XCURSOR_THEME="Adwaita"

          chromium \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-session-crashed-bubble \
            --disable-infobars \
            --disable-translate \
            --no-first-run \
            --no-default-browser-check \
            --disable-features=Translate,MediaRouter \
            --ozone-platform=x11 \
            --force-device-scale-factor=1 \
            --remote-debugging-address=127.0.0.1 \
            --remote-allow-origins=http://127.0.0.1:9222 \
            --remote-debugging-port=9222 \
            --kiosk \
            --start-fullscreen \
            --window-position=0,0 \
            --window-size="${WIDTH},${HEIGHT}" \
            --user-data-dir=/tmp/chromium-profile \
            "$SITE_URL" \
            > /tmp/saas-recorder/chromium.log 2>&1 &

          echo $! > /tmp/saas-recorder/chromium.pid

          echo "Waiting for Chromium window..."
          for i in $(seq 1 45); do
            if DISPLAY="$DISPLAY" xdotool search --onlyvisible --class chromium >/dev/null 2>&1; then
              echo "Chromium window detected."
              break
            fi
            sleep 1
          done

          sleep 5
          DISPLAY="$DISPLAY" xdotool mousemove 5 5

      - name: Diagnose Fonts And Browser Rendering
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/saas-recorder/browser_diagnostics.py <<'PY'
          import json
          import time
          import urllib.request
          import websocket

          def get_json(url):
              with urllib.request.urlopen(url, timeout=5) as response:
                  return json.loads(response.read().decode())

          def cdp(ws_url, method, params=None, msg_id=1):
              ws = websocket.create_connection(ws_url, timeout=15)
              try:
                  ws.send(json.dumps({
                      "id": msg_id,
                      "method": method,
                      "params": params or {}
                  }))
                  while True:
                      message = json.loads(ws.recv())
                      if message.get("id") == msg_id:
                          return message
              finally:
                  ws.close()

          target = None
          for _ in range(45):
              try:
                  targets = get_json("http://127.0.0.1:9222/json")
                  pages = [x for x in targets if x.get("type") == "page"]
                  if pages:
                      target = pages[0]
                      break
              except Exception:
                  pass
              time.sleep(1)

          if not target:
              raise SystemExit("Could not find Chromium DevTools page.")

          ws_url = target["webSocketDebuggerUrl"]

          js = r'''
          (async () => {
            await document.fonts.ready;
            const visible = el => {
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              return r.width > 0 && r.height > 0 && s.visibility !== 'hidden' && s.display !== 'none';
            };
            const candidates = [...document.querySelectorAll('body *')]
              .filter(el => visible(el) && ((el.textContent || '').trim().length > 0))
              .slice(0, 80)
              .map(el => {
                const s = getComputedStyle(el);
                return {
                  tag: el.tagName.toLowerCase(),
                  text: (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 100),
                  fontFamily: s.fontFamily,
                  fontSize: s.fontSize,
                  fontWeight: s.fontWeight,
                  lineHeight: s.lineHeight,
                  letterSpacing: s.letterSpacing
                };
              });
            return {
              url: location.href,
              readyState: document.readyState,
              language: document.documentElement.lang,
              direction: getComputedStyle(document.documentElement).direction,
              documentFontsStatus: document.fonts.status,
              documentFonts: [...document.fonts].map(f => ({
                family: f.family,
                style: f.style,
                weight: f.weight,
                stretch: f.stretch,
                status: f.status,
                display: f.display
              })),
              bodyFont: getComputedStyle(document.body).fontFamily,
              bodyFontSize: getComputedStyle(document.body).fontSize,
              bodyFontWeight: getComputedStyle(document.body).fontWeight,
              candidates,
              viewport: {
                width: window.innerWidth,
                height: window.innerHeight,
                devicePixelRatio: window.devicePixelRatio,
                screenWidth: screen.width,
                screenHeight: screen.height
              }
            };
          })()
          '''

          result = cdp(
              ws_url,
              "Runtime.evaluate",
              {
                  "expression": js,
                  "awaitPromise": True,
                  "returnByValue": True
              }
          )

          if "exceptionDetails" in result.get("result", {}):
              print(json.dumps(result, indent=2))
              raise SystemExit("Browser diagnostic JavaScript failed.")

          value = result["result"]["result"].get("value", {})

          with open("/tmp/saas-recorder/font-diagnostics.json", "w", encoding="utf-8") as f:
              json.dump(value, f, ensure_ascii=False, indent=2)

          print(json.dumps(value, ensure_ascii=False, indent=2))
          PY

          python3 /tmp/saas-recorder/browser_diagnostics.py

          echo "Taking diagnostic frame..."
          ffmpeg -hide_banner -loglevel warning \
            -f x11grab \
            -draw_mouse 1 \
            -video_size "${WIDTH}x${HEIGHT}" \
            -framerate 1 \
            -i "${DISPLAY}.0" \
            -frames:v 1 \
            -y "$DIAGNOSTIC_SCREENSHOT"

          echo "Diagnostic files created:"
          ls -lh /tmp/saas-recorder/font-diagnostics.json "$DIAGNOSTIC_SCREENSHOT"

          echo
          echo "========== SYSTEM FONT MATCHES =========="
          fc-match Tajawal || true
          fc-match "Noto Sans Arabic" || true
          echo
          echo "========== BROWSER DIAGNOSTICS =========="
          cat /tmp/saas-recorder/font-diagnostics.json

      - name: Start VNC Server
        shell: bash
        run: |
          set -euo pipefail

          VNC_PASSWORD="$(openssl rand -hex 8)"
          echo "$VNC_PASSWORD" > /tmp/saas-recorder/vnc-password.txt
          chmod 600 /tmp/saas-recorder/vnc-password.txt

          x11vnc -storepasswd \
            "$VNC_PASSWORD" \
            /tmp/saas-recorder/vnc-pass

          chmod 600 /tmp/saas-recorder/vnc-pass
          echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"

          export DISPLAY="$DISPLAY"
          export XCURSOR_SIZE="$XCURSOR_SIZE"
          export XCURSOR_THEME="Adwaita"

          x11vnc \
            -display "$DISPLAY" \
            -rfbport 5900 \
            -rfbauth /tmp/saas-recorder/vnc-pass \
            -localhost \
            -forever \
            -shared \
            -noxdamage \
            -repeat \
            -noshm \
            -wait 5 \
            -defer 5 \
            > /tmp/saas-recorder/x11vnc.log 2>&1 &

          echo $! > /tmp/saas-recorder/x11vnc.pid
          sleep 5
          kill -0 "$(cat /tmp/saas-recorder/x11vnc.pid)"

      - name: Start noVNC
        shell: bash
        run: |
          set -euo pipefail

          nohup websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > /tmp/saas-recorder/novnc.log 2>&1 < /dev/null &

          echo $! > /tmp/saas-recorder/novnc.pid
          sleep 5
          curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null

      - name: Create Recording API
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/saas-recorder/server.py <<'PY'
          import json
          import os
          import signal
          import subprocess
          import threading
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          HOST = "127.0.0.1"
          PORT = 8090
          DISPLAY = os.environ["DISPLAY"]
          WIDTH = int(os.environ["WIDTH"])
          HEIGHT = int(os.environ["HEIGHT"])
          FPS = int(os.environ["FPS"])
          OUTPUT = os.environ["RECORDING_FILE"]
          TOKEN = os.environ["RECORD_API_TOKEN"]
          LOGFILE = "/tmp/saas-recorder/ffmpeg.log"

          lock = threading.RLock()
          ffmpeg_process = None
          started_at = None
          status = "idle"
          error_message = None
          final_info = None

          def make_json(handler, code, payload):
              raw = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              handler.send_response(code)
              handler.send_header("Content-Type", "application/json; charset=utf-8")
              handler.send_header("Cache-Control", "no-store")
              handler.send_header("Content-Length", str(len(raw)))
              handler.end_headers()
              handler.wfile.write(raw)

          def authorized(handler):
              return handler.headers.get("Authorization", "") == f"Bearer {TOKEN}"

          def probe_file():
              if not os.path.exists(OUTPUT):
                  return None
              size = os.path.getsize(OUTPUT)
              if size < 100_000:
                  return None

              command = [
                  "ffprobe", "-v", "error", "-select_streams", "v:0",
                  "-show_entries", "stream=codec_name,profile,level,width,height,avg_frame_rate,pix_fmt,duration",
                  "-of", "json", OUTPUT
              ]
              result = subprocess.run(command, capture_output=True, text=True)
              if result.returncode != 0:
                  return None

              try:
                  payload = json.loads(result.stdout)
                  stream = payload.get("streams", [None])[0]
                  if not stream:
                      return None
                  rate = stream.get("avg_frame_rate", "0/1")
                  n, d = rate.split("/", 1)
                  fps_value = round(float(n) / float(d), 3) if float(d) else 0
                  return {
                      "file": OUTPUT,
                      "size_bytes": size,
                      "size_mb": round(size / 1024 / 1024, 2),
                      "codec": stream.get("codec_name"),
                      "profile": stream.get("profile"),
                      "level": stream.get("level"),
                      "width": stream.get("width"),
                      "height": stream.get("height"),
                      "fps": fps_value,
                      "pixel_format": stream.get("pix_fmt"),
                      "duration": round(float(stream.get("duration") or 0), 3)
                  }
              except Exception:
                  return None

          def snapshot():
              with lock:
                  live_duration = 0
                  if started_at is not None:
                      live_duration = max(0, round(time.time() - started_at, 3))
                  return {
                      "success": status != "failed",
                      "status": status,
                      "recording": status == "recording",
                      "started_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(started_at)) if started_at else None,
                      "duration_live": live_duration,
                      "file_ready": status == "completed" and final_info is not None,
                      "file": final_info,
                      "error": error_message
                  }

          def start_recording():
              global ffmpeg_process, started_at, status, error_message, final_info
              with lock:
                  if status == "recording":
                      return 409, snapshot()
                  if status == "finalizing":
                      return 409, snapshot()

                  if os.path.exists(OUTPUT):
                      os.remove(OUTPUT)

                  final_info = None
                  error_message = None
                  log = open(LOGFILE, "w", buffering=1)

                  command = [
                      "ffmpeg", "-hide_banner", "-loglevel", "warning",
                      "-f", "x11grab",
                      "-draw_mouse", "1",
                      "-framerate", str(FPS),
                      "-video_size", f"{WIDTH}x{HEIGHT}",
                      "-i", f"{DISPLAY}.0",
                      "-an",
                      "-c:v", "libx264",
                      "-preset", "veryfast",
                      "-crf", "14",
                      "-profile:v", "high",
                      "-level:v", "5.1",
                      "-tune", "animation",
                      "-pix_fmt", "yuv420p",
                      "-movflags", "+faststart",
                      "-y", OUTPUT
                  ]

                  ffmpeg_process = subprocess.Popen(
                      command,
                      stdout=log,
                      stderr=subprocess.STDOUT
                  )
                  started_at = time.time()
                  status = "recording"

                  return 200, snapshot()

          def stop_recording():
              global ffmpeg_process, status, error_message, final_info
              with lock:
                  if status != "recording" or ffmpeg_process is None:
                      return 409, snapshot()
                  process = ffmpeg_process
                  status = "finalizing"

              try:
                  process.send_signal(signal.SIGINT)
                  process.wait(timeout=45)
              except subprocess.TimeoutExpired:
                  try:
                      process.terminate()
                      process.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      try:
                          process.kill()
                      except Exception:
                          pass
                      process.wait(timeout=5)
              except Exception as exc:
                  with lock:
                      status = "failed"
                      error_message = str(exc)
                  return 500, snapshot()

              info = probe_file()

              with lock:
                  ffmpeg_process = None
                  if process.returncode not in (0, 255):
                      status = "failed"
                      error_message = f"FFmpeg exited with code {process.returncode}"
                  elif not info:
                      status = "failed"
                      error_message = "MP4 was not finalized or ffprobe could not validate it."
                  else:
                      status = "completed"
                      error_message = None
                      final_info = info

                  return (200 if status == "completed" else 500), snapshot()

          class Handler(BaseHTTPRequestHandler):
              server_version = "SaaSRecorderAPI/2.0"

              def log_message(self, fmt, *args):
                  print(fmt % args, flush=True)

              def do_GET(self):
                  if self.path == "/api/health":
                      make_json(self, 200, {"ok": True})
                      return

                  if not self.path.startswith("/api/") or not authorized(self):
                      make_json(self, 401, {"success": False, "error": "Unauthorized"})
                      return

                  if self.path in ("/api/status", "/api/record/status"):
                      make_json(self, 200, snapshot())
                      return

                  make_json(self, 404, {"success": False, "error": "Not found"})

              def do_POST(self):
                  if not self.path.startswith("/api/") or not authorized(self):
                      make_json(self, 401, {"success": False, "error": "Unauthorized"})
                      return

                  if self.path == "/api/record/start":
                      code, payload = start_recording()
                      make_json(self, code, payload)
                      return

                  if self.path == "/api/record/stop":
                      code, payload = stop_recording()
                      make_json(self, code, payload)
                      return

                  make_json(self, 404, {"success": False, "error": "Not found"})

          server = ThreadingHTTPServer((HOST, PORT), Handler)
          print(f"Recording API listening on http://{HOST}:{PORT}", flush=True)
          server.serve_forever()
          PY

      - name: Create Control Panel
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p /opt/saas-recorder

          sudo tee /opt/saas-recorder/control.html >/dev/null <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>SaaS Recording Control</title>
            <style>
              *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#f5f5f5;color:#1c1917;font-family:Arial,sans-serif}header{height:66px;background:#fff;border-bottom:1px solid #ddd;padding:0 18px;display:flex;align-items:center;gap:12px}.title{font-weight:800;font-size:18px}.badge{border:1px solid #ddd;background:#fafafa;border-radius:999px;padding:6px 10px;font-size:12px}.main{height:calc(100% - 66px);display:grid;grid-template-columns:320px 1fr;gap:14px;padding:14px}.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;overflow:auto}.viewer{padding:0;background:#111;overflow:hidden}.viewer iframe{width:100%;height:100%;border:0;display:block}.stack{display:flex;flex-direction:column;gap:10px}label{font-size:12px;font-weight:800}input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff}button{border:0;border-radius:9px;padding:12px;font-weight:800;cursor:pointer}.start{background:#1c1917;color:#fff}.stop{background:#ddd;color:#1c1917}.neutral{background:#efefef;color:#1c1917}.status{border:1px solid #ddd;border-radius:9px;background:#fafafa;padding:11px;font:11px/1.45 monospace;white-space:pre-wrap;overflow-wrap:anywhere}.hint{font-size:11px;line-height:1.55;color:#666}.ok{color:#176b2c}.bad{color:#a00}.row{display:flex;gap:8px}.row button{flex:1}@media(max-width:900px){.main{grid-template-columns:1fr}.viewer{height:65vh}.panel{max-height:35vh}}
            </style>
          </head>
          <body>
            <header>
              <div class="title">🎥 SaaS Recording Control</div>
              <div id="badge" class="badge">IDLE</div>
              <div class="badge">2560×1440 · 60 FPS · H.264</div>
            </header>
            <div class="main">
              <section class="panel">
                <div class="stack">
                  <div><label>Recording API Token</label><input id="token" type="password" autocomplete="off" placeholder="Token from Actions Summary"></div>
                  <div><label>VNC Password</label><input id="vncpass" type="password" autocomplete="off" placeholder="Password from Actions Summary"></div>
                  <div class="row"><button class="neutral" onclick="openRemote()">Open Remote</button><button class="neutral" onclick="reloadRemote()">Reload</button></div>
                  <button class="start" onclick="startRecording()">🔴 START RECORDING</button>
                  <button class="stop" onclick="stopRecording()">⏹ STOP & SAVE VIDEO</button>
                  <div id="status" class="status">Waiting...</div>
                  <div class="hint"><b>Workflow:</b><br>1. Open the remote view.<br>2. Prepare the SaaS demo.<br>3. Press START exactly at the first frame you want.<br>4. Perform your mouse/keyboard actions.<br>5. Press STOP exactly at the last frame you want.<br>6. FFmpeg finalizes and validates the MP4.<br><br>The session timeout is only a safety limit. It does not define the video duration.</div>
                </div>
              </section>
              <section class="panel viewer"><iframe id="remote" src="/vnc.html?autoconnect=true&resize=scale&path=websockify"></iframe></section>
            </div>
            <script>
              const token=document.getElementById('token');
              const pass=document.getElementById('vncpass');
              const badge=document.getElementById('badge');
              const box=document.getElementById('status');
              const frame=document.getElementById('remote');
              token.value=sessionStorage.getItem('recordToken')||'';
              pass.value=sessionStorage.getItem('vncPassword')||'';
              token.oninput=()=>sessionStorage.setItem('recordToken',token.value.trim());
              pass.oninput=()=>sessionStorage.setItem('vncPassword',pass.value.trim());
              function headers(){const t=token.value.trim();if(!t)throw new Error('ضع Recording API Token من GitHub Actions Summary.');return {'Authorization':'Bearer '+t};}
              async function api(path,method='GET'){const r=await fetch(path,{method,headers:headers(),cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d;}
              function render(d){badge.textContent=(d.status||'UNKNOWN').toUpperCase();badge.className='badge '+(d.status==='recording'?'bad':d.status==='completed'?'ok':'');box.textContent=JSON.stringify(d,null,2);}
              async function refresh(){try{render(await api('/api/status'))}catch(e){box.textContent=e.message}}
              async function startRecording(){try{render(await api('/api/record/start','POST'))}catch(e){alert(e.message);await refresh()}}
              async function stopRecording(){try{box.textContent='Finalizing MP4...';render(await api('/api/record/stop','POST'))}catch(e){alert(e.message);await refresh()}}
              function openRemote(){const p=pass.value.trim();frame.src='/vnc.html?autoconnect=true&resize=scale&path=websockify'+(p?'&password='+encodeURIComponent(p):'')}
              function reloadRemote(){frame.src='/vnc.html?autoconnect=true&resize=scale&path=websockify'}
              refresh();setInterval(refresh,3000);
            </script>
          </body>
          </html>
          HTML

      - name: Start Recording API
        shell: bash
        run: |
          set -euo pipefail

          RECORD_API_TOKEN="$(openssl rand -hex 32)"
          echo "RECORD_API_TOKEN=$RECORD_API_TOKEN" >> "$GITHUB_ENV"

          nohup env \
            DISPLAY="$DISPLAY" \
            WIDTH="$WIDTH" \
            HEIGHT="$HEIGHT" \
            FPS="$FPS" \
            RECORDING_FILE="$RECORDING_FILE" \
            RECORD_API_TOKEN="$RECORD_API_TOKEN" \
            python3 /tmp/saas-recorder/server.py \
            > /tmp/saas-recorder/api.log 2>&1 < /dev/null &

          echo $! > /tmp/saas-recorder/api.pid
          sleep 3
          curl -fsS http://127.0.0.1:8090/api/health

      - name: Configure Local Gateway
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -f /etc/nginx/sites-enabled/default

          sudo tee /etc/nginx/sites-available/saas-recorder >/dev/null <<'NGINX'
          server {
              listen 8080;
              server_name _;
              client_max_body_size 2g;

              location /api/ {
                  proxy_pass http://127.0.0.1:8090;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_read_timeout 120s;
              }

              location = /control.html {
                  alias /opt/saas-recorder/control.html;
                  default_type text/html;
              }

              location = / {
                  return 302 /control.html;
              }

              location /websockify {
                  proxy_pass http://127.0.0.1:6080;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_read_timeout 86400;
              }

              location / {
                  proxy_pass http://127.0.0.1:6080;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_read_timeout 86400;
              }
          }
          NGINX

          sudo ln -sf /etc/nginx/sites-available/saas-recorder /etc/nginx/sites-enabled/saas-recorder
          sudo nginx -t
          sudo systemctl restart nginx
          sleep 2
          curl -fsS http://127.0.0.1:8080/control.html >/dev/null

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb || sudo apt-get install -f -y
          cloudflared --version

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:8080 \
            > /tmp/saas-recorder/cloudflared.log 2>&1 < /dev/null &

          echo $! > /tmp/saas-recorder/cloudflared.pid

          REMOTE_URL=""
          for i in $(seq 1 60); do
            REMOTE_URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/saas-recorder/cloudflared.log | head -n 1 || true)"
            if [ -n "$REMOTE_URL" ]; then break; fi
            sleep 1
          done

          if [ -z "$REMOTE_URL" ]; then
            cat /tmp/saas-recorder/cloudflared.log
            exit 1
          fi

          echo "REMOTE_URL=$REMOTE_URL" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo "REMOTE CONTROL PANEL"
          echo "$REMOTE_URL/control.html"
          echo "============================================================"
          echo "DIRECT NOVNC"
          echo "$REMOTE_URL/vnc.html?autoconnect=true&resize=scale&path=websockify"
          echo "============================================================"
          echo "RECORDING API TOKEN"
          echo "$RECORD_API_TOKEN"
          echo "============================================================"
          echo "VNC PASSWORD"
          echo "$VNC_PASSWORD"
          echo "============================================================"

          {
            echo "# 🎥 SaaS Recording Session"
            echo
            echo "## Remote Control Panel"
            echo
            echo "$REMOTE_URL/control.html"
            echo
            echo "## Direct noVNC"
            echo
            echo "$REMOTE_URL/vnc.html?autoconnect=true&resize=scale&path=websockify"
            echo
            echo "## Recording API Token"
            echo
            echo "\`$RECORD_API_TOKEN\`"
            echo
            echo "## VNC Password"
            echo
            echo "\`$VNC_PASSWORD\`"
            echo
            echo "## SaaS Site"
            echo
            echo "$SITE_URL"
            echo
            echo "## Capture"
            echo
            echo "${WIDTH} × ${HEIGHT} @ ${FPS} FPS"
            echo "Mouse cursor target: ${XCURSOR_SIZE}px"
            echo "Video: H.264 High / yuv420p / MP4"
            echo
            echo "## Recording API"
            echo
            echo "GET  $REMOTE_URL/api/status"
            echo "POST $REMOTE_URL/api/record/start"
            echo "POST $REMOTE_URL/api/record/stop"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait For START And STOP
        shell: bash
        run: |
          set -euo pipefail

          TOTAL_SECONDS=$((SESSION_MINUTES * 60))
          START_TIME="$(date +%s)"

          echo "============================================================"
          echo "SESSION READY"
          echo "Open: $REMOTE_URL/control.html"
          echo "Press START only when the recording should begin."
          echo "Press STOP only when the recording should end."
          echo "Safety session limit: ${SESSION_MINUTES} minutes."
          echo "============================================================"

          while true; do
            JSON="$(curl -fsS -H "Authorization: Bearer ${RECORD_API_TOKEN}" http://127.0.0.1:8090/api/status)"
            echo "$JSON"

            STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","unknown"))' <<< "$JSON")"

            if [ "$STATUS" = "completed" ]; then
              echo "Recording completed by STOP command."
              break
            fi

            if [ "$STATUS" = "failed" ]; then
              echo "Recording API reported failure."
              exit 1
            fi

            NOW="$(date +%s)"
            if [ $((NOW - START_TIME)) -ge "$TOTAL_SECONDS" ]; then
              echo "Safety session limit reached."
              echo "Attempting graceful STOP if recording is active."
              curl -fsS -X POST \
                -H "Authorization: Bearer ${RECORD_API_TOKEN}" \
                http://127.0.0.1:8090/api/record/stop || true
              break
            fi

            sleep 3
          done

      - name: Verify Final MP4
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$RECORDING_FILE" ]; then
            echo "No recording file found."
            exit 1
          fi

          SIZE="$(stat -c%s "$RECORDING_FILE")"
          if [ "$SIZE" -lt 100000 ]; then
            echo "Recording file is unexpectedly small: $SIZE bytes"
            exit 1
          fi

          echo "========== FINAL VIDEO =========="
          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,profile,level,width,height,avg_frame_rate,pix_fmt,duration \
            -of default=noprint_wrappers=1 \
            "$RECORDING_FILE"

          echo
          ls -lh "$RECORDING_FILE"

      - name: Upload Final Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saas-demo-recording
          path: recording.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Font Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-font-diagnostics
          path: |
            /tmp/saas-recorder/font-diagnostics.json
            diagnostic-before-recording.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Runtime Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-logs
          path: /tmp/saas-recorder/
          if-no-files-found: ignore
          retention-days: 3

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          if [ -f /tmp/saas-recorder/api.pid ]; then kill "$(cat /tmp/saas-recorder/api.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/saas-recorder/cloudflared.pid ]; then kill "$(cat /tmp/saas-recorder/cloudflared.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/saas-recorder/novnc.pid ]; then kill "$(cat /tmp/saas-recorder/novnc.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/saas-recorder/x11vnc.pid ]; then kill "$(cat /tmp/saas-recorder/x11vnc.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/saas-recorder/chromium.pid ]; then kill "$(cat /tmp/saas-recorder/chromium.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/saas-recorder/xvfb.pid ]; then kill "$(cat /tmp/saas-recorder/xvfb.pid)" 2>/dev/null || true; fi

          pkill -f ffmpeg 2>/dev/null || true
          pkill -f cloudflared 2>/dev/null || true
          pkill -f websockify 2>/dev/null || true
          pkill -f x11vnc 2>/dev/null || true
          pkill -f chromium 2>/dev/null || true
          pkill -f Xvfb 2>/dev/null || true

          echo "Cleanup complete."
