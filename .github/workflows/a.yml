name: Remote SaaS Demo Recorder2

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "رابط الموقع الذي سيتم فتحه في Chromium"
        required: true
        default: "https://example.com"

      session_minutes:
        description: "مدة تشغيل الكمبيوتر والتسجيل بالدقائق"
        required: true
        default: "60"

      width:
        description: "عرض الشاشة"
        required: true
        default: "1920"

      height:
        description: "ارتفاع الشاشة"
        required: true
        default: "1080"

      fps:
        description: "عدد الإطارات في الثانية"
        required: true
        default: "60"

permissions:
  contents: read

jobs:
  remote-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      DISPLAY: ":99"
      WIDTH: ${{ inputs.width }}
      HEIGHT: ${{ inputs.height }}
      FPS: ${{ inputs.fps }}
      SITE_URL: ${{ inputs.site_url }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}

    steps:

      - name: Install Recording Environment
        shell: bash
        run: |
          set -e

          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            xdotool \
            x11-utils \
            x11-xserver-utils \
            ffmpeg \
            chromium \
            fontconfig \
            fonts-dejavu \
            fonts-liberation \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-noto-color-emoji \
            fonts-noto-cjk \
            ca-certificates \
            curl \
            wget \
            openssl

          echo
          echo "=============================================="
          echo "Installed software"
          echo "=============================================="
          chromium --version
          ffmpeg -version | head -n 1
          xdotool --version
          x11vnc -version 2>&1 | head -n 2 || true
          websockify --version 2>&1 || true
          fc-match sans
          fc-match serif
          fc-match "Noto Sans Arabic"
          echo "=============================================="

          fc-cache -f -v >/tmp/font-cache.log 2>&1 || true

          echo
          echo "Font cache refreshed."

      - name: Start Virtual Display
        shell: bash
        run: |
          set -e

          echo "Starting Xvfb..."

          Xvfb "${DISPLAY}" \
            -screen 0 "${WIDTH}x${HEIGHT}x24" \
            -dpi 96 \
            -ac \
            +extension GLX \
            +extension RANDR \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          XVFB_PID=$!
          echo "${XVFB_PID}" > /tmp/xvfb.pid

          sleep 3

          echo
          echo "=============================================="
          echo "Virtual Display"
          echo "=============================================="

          DISPLAY="${DISPLAY}" xdpyinfo | grep -E "dimensions|depth of root"

          DISPLAY="${DISPLAY}" xrandr || true

          echo
          echo "Display ready."

      - name: Prepare Chromium Profile
        shell: bash
        run: |
          set -e

          rm -rf /tmp/chromium-profile
          mkdir -p /tmp/chromium-profile

          cat > /tmp/chromium-preferences.json <<'EOF'
          {
            "webkit": {
              "webprefs": {
                "default_fixed_font_size": 16,
                "default_font_size": 16
              }
            }
          }
          EOF

          echo "Chromium profile prepared."

      - name: Start Chromium
        shell: bash
        run: |
          set -e

          echo
          echo "Opening:"
          echo "${SITE_URL}"

          chromium \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-session-crashed-bubble \
            --disable-infobars \
            --disable-translate \
            --no-first-run \
            --no-default-browser-check \
            --disable-features=Translate,MediaRouter \
            --force-device-scale-factor=1 \
            --force-color-profile=srgb \
            --kiosk \
            --start-fullscreen \
            --window-position=0,0 \
            --window-size="${WIDTH},${HEIGHT}" \
            --user-data-dir=/tmp/chromium-profile \
            "${SITE_URL}" \
            > /tmp/chromium.log 2>&1 &

          CHROMIUM_PID=$!
          echo "${CHROMIUM_PID}" > /tmp/chromium.pid

          echo
          echo "Waiting for Chromium..."

          FOUND="false"

          for i in $(seq 1 40); do
            if DISPLAY="${DISPLAY}" xdotool search --onlyvisible --class chromium >/dev/null 2>&1; then
              FOUND="true"
              echo "Chromium window detected."
              break
            fi

            sleep 1
          done

          if [ "${FOUND}" != "true" ]; then
            echo "Chromium window was not detected."

            echo
            echo "Chromium log:"
            cat /tmp/chromium.log || true

            exit 1
          fi

          sleep 8

          DISPLAY="${DISPLAY}" xdotool mousemove 1 1

          echo
          echo "Chromium is ready."

          echo
          echo "Visible Chromium windows:"
          DISPLAY="${DISPLAY}" \
            xdotool search --onlyvisible --class chromium \
            getwindowname %@ || true

      - name: Verify Fonts
        shell: bash
        run: |
          set -e

          echo
          echo "=============================================="
          echo "Font Environment"
          echo "=============================================="

          echo
          echo "Generic sans:"
          fc-match sans

          echo
          echo "Noto Sans:"
          fc-match "Noto Sans"

          echo
          echo "Noto Sans Arabic:"
          fc-match "Noto Sans Arabic"

          echo
          echo "Liberation Sans:"
          fc-match "Liberation Sans"

          echo
          echo "DejaVu Sans:"
          fc-match "DejaVu Sans"

          echo
          echo "Fontconfig:"
          fc-match --format='%{family} | %{style} | %{file}\n' sans

          echo
          echo "=============================================="

      - name: Start VNC Server
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.vnc"

          VNC_PASSWORD="$(openssl rand -hex 6)"

          echo "${VNC_PASSWORD}" > /tmp/vnc-password.txt

          x11vnc -storepasswd \
            "${VNC_PASSWORD}" \
            "$HOME/.vnc/passwd"

          chmod 600 "$HOME/.vnc/passwd"

          echo "VNC_PASSWORD=${VNC_PASSWORD}" >> "$GITHUB_ENV"

          echo
          echo "Starting x11vnc..."

          x11vnc \
            -display "${DISPLAY}" \
            -rfbport 5900 \
            -rfbauth "$HOME/.vnc/passwd" \
            -localhost \
            -forever \
            -shared \
            -noxdamage \
            -noxfixes \
            -repeat \
            -noshm \
            -wait 5 \
            -defer 5 \
            > /tmp/x11vnc.log 2>&1 &

          X11VNC_PID=$!
          echo "${X11VNC_PID}" > /tmp/x11vnc.pid

          sleep 5

          if ! kill -0 "${X11VNC_PID}" 2>/dev/null; then
            echo "x11vnc failed."

            echo
            cat /tmp/x11vnc.log || true

            exit 1
          fi

          echo "x11vnc is running."

      - name: Start noVNC
        shell: bash
        run: |
          set -e

          echo "Starting noVNC..."

          if [ -d "/usr/share/novnc" ]; then
            NOVNC_PATH="/usr/share/novnc"
          elif [ -d "/usr/share/noVNC" ]; then
            NOVNC_PATH="/usr/share/noVNC"
          else
            echo "noVNC directory was not found."

            dpkg -L novnc || true

            exit 1
          fi

          echo "noVNC path: ${NOVNC_PATH}"

          nohup websockify \
            --web="${NOVNC_PATH}" \
            6080 \
            127.0.0.1:5900 \
            > /tmp/novnc.log 2>&1 < /dev/null &

          NOVNC_PID=$!
          echo "${NOVNC_PID}" > /tmp/novnc.pid

          sleep 5

          curl -fsS \
            http://127.0.0.1:6080/vnc.html \
            >/dev/null

          echo "noVNC is running."

      - name: Install Cloudflared
        shell: bash
        run: |
          set -e

          echo "Downloading cloudflared..."

          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb || \
            sudo apt-get install -f -y

          cloudflared --version

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -e

          echo
          echo "=============================================="
          echo "Starting Cloudflare Quick Tunnel"
          echo "=============================================="

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:6080 \
            > /tmp/cloudflared.log 2>&1 < /dev/null &

          CLOUDFLARED_PID=$!
          echo "${CLOUDFLARED_PID}" > /tmp/cloudflared.pid

          REMOTE_URL=""

          echo "Waiting for trycloudflare.com URL..."

          for i in $(seq 1 60); do
            REMOTE_URL="$(
              grep -oE \
                'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log |
              head -n 1 || true
            )"

            if [ -n "${REMOTE_URL}" ]; then
              break
            fi

            sleep 1
          done

          if [ -z "${REMOTE_URL}" ]; then
            echo "Cloudflare tunnel did not start."

            echo
            echo "Cloudflared log:"
            cat /tmp/cloudflared.log || true

            exit 1
          fi

          echo "REMOTE_URL=${REMOTE_URL}" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "REMOTE COMPUTER READY"
          echo "=============================================="
          echo
          echo "Remote Desktop:"
          echo "${REMOTE_URL}/vnc.html?autoconnect=true&resize=scale"
          echo
          echo "Password:"
          echo "${VNC_PASSWORD}"
          echo
          echo "Site:"
          echo "${SITE_URL}"
          echo
          echo "Resolution:"
          echo "${WIDTH}x${HEIGHT}"
          echo
          echo "FPS:"
          echo "${FPS}"
          echo
          echo "=============================================="

          cat > /tmp/remote-info.txt <<EOF
          REMOTE COMPUTER READY

          Remote Desktop:
          ${REMOTE_URL}/vnc.html?autoconnect=true&resize=scale

          VNC Password:
          ${VNC_PASSWORD}

          Site:
          ${SITE_URL}

          Resolution:
          ${WIDTH}x${HEIGHT}

          FPS:
          ${FPS}

          Session:
          ${SESSION_MINUTES} minutes
          EOF

          {
            echo "# 🖥️ Remote SaaS Demo Computer"
            echo
            echo "## 🌐 Remote Desktop"
            echo
            echo "${REMOTE_URL}/vnc.html?autoconnect=true&resize=scale"
            echo
            echo "## 🔐 VNC Password"
            echo
            echo "\`${VNC_PASSWORD}\`"
            echo
            echo "## 🌐 SaaS Website"
            echo
            echo "${SITE_URL}"
            echo
            echo "## 🖥️ Display"
            echo
            echo "${WIDTH} × ${HEIGHT}"
            echo
            echo "## 🎥 Recording"
            echo
            echo "${FPS} FPS"
            echo
            echo "Recording will start automatically."
            echo
            echo "Use the Remote Desktop link to control the virtual computer."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait For Remote Connection
        shell: bash
        run: |
          set -e

          echo
          echo "=============================================="
          echo "REMOTE COMPUTER IS READY"
          echo "=============================================="
          echo
          echo "Use the URL from the previous step."
          echo
          echo "Starting recording in 20 seconds..."
          echo

          for i in $(seq 20 -1 1); do
            echo "Starting recording in ${i}s..."
            sleep 1
          done

      - name: Start Recording
        shell: bash
        run: |
          set -e

          rm -f recording.mp4

          echo
          echo "=============================================="
          echo "🎥 STARTING RECORDING"
          echo "=============================================="

          nohup ffmpeg \
            -hide_banner \
            -loglevel warning \
            -f x11grab \
            -draw_mouse 1 \
            -framerate "${FPS}" \
            -video_size "${WIDTH}x${HEIGHT}" \
            -i "${DISPLAY}.0" \
            -an \
            -c:v libx264 \
            -preset faster \
            -crf 16 \
            -tune animation \
            -pix_fmt yuv420p \
            -movflags +faststart \
            recording.mp4 \
            > /tmp/ffmpeg.log 2>&1 < /dev/null &

          FFMPEG_PID=$!

          echo "${FFMPEG_PID}" > /tmp/ffmpeg.pid

          sleep 4

          if ! kill -0 "${FFMPEG_PID}" 2>/dev/null; then
            echo "FFmpeg failed to start."

            echo
            echo "FFmpeg log:"
            cat /tmp/ffmpeg.log || true

            exit 1
          fi

          echo
          echo "Recording started successfully."
          echo
          echo "Control the virtual computer now."
          echo

          echo "ffmpeg PID: ${FFMPEG_PID}"

      - name: Keep Computer And Recording Online
        shell: bash
        run: |
          set -e

          MINUTES="${SESSION_MINUTES}"

          if ! [[ "${MINUTES}" =~ ^[0-9]+$ ]]; then
            echo "Invalid session_minutes: ${MINUTES}"
            exit 1
          fi

          TOTAL_SECONDS=$((MINUTES * 60))

          echo
          echo "=============================================="
          echo "SESSION ACTIVE"
          echo "=============================================="
          echo
          echo "Duration: ${MINUTES} minutes"
          echo "Resolution: ${WIDTH}x${HEIGHT}"
          echo "FPS: ${FPS}"
          echo

          for ((i=1; i<=TOTAL_SECONDS; i++)); do
            sleep 1

            if (( i % 30 == 0 )); then
              REMAINING=$((TOTAL_SECONDS - i))

              echo "Remaining: ${REMAINING} seconds"

              if [ -f /tmp/ffmpeg.pid ]; then
                FFMPEG_PID="$(cat /tmp/ffmpeg.pid)"

                if ! kill -0 "${FFMPEG_PID}" 2>/dev/null; then
                  echo
                  echo "ERROR: FFmpeg stopped unexpectedly."
                  echo

                  cat /tmp/ffmpeg.log || true

                  exit 1
                fi
              fi
            fi
          done

          echo
          echo "Session time completed."

      - name: Stop Recording Cleanly
        if: always()
        shell: bash
        run: |
          set +e

          echo
          echo "=============================================="
          echo "STOPPING RECORDING"
          echo "=============================================="

          if [ -f /tmp/ffmpeg.pid ]; then
            FFMPEG_PID="$(cat /tmp/ffmpeg.pid)"

            if kill -0 "${FFMPEG_PID}" 2>/dev/null; then
              echo "Sending SIGINT to FFmpeg..."

              kill -INT "${FFMPEG_PID}" 2>/dev/null || true

              for i in $(seq 1 30); do
                if ! kill -0 "${FFMPEG_PID}" 2>/dev/null; then
                  echo "FFmpeg stopped cleanly."
                  break
                fi

                sleep 1
              done

              if kill -0 "${FFMPEG_PID}" 2>/dev/null; then
                echo "FFmpeg did not stop after SIGINT."
                echo "Sending SIGTERM..."

                kill -TERM "${FFMPEG_PID}" 2>/dev/null || true

                sleep 3
              fi
            else
              echo "FFmpeg process is already stopped."
            fi
          else
            echo "FFmpeg PID file not found."
          fi

          echo
          echo "FFmpeg log:"
          tail -n 100 /tmp/ffmpeg.log 2>/dev/null || true

          echo
          echo "Checking output file..."

          if [ ! -f recording.mp4 ]; then
            echo "ERROR: recording.mp4 was not created."
            exit 1
          fi

          FILE_SIZE="$(stat -c%s recording.mp4 2>/dev/null || echo 0)"

          echo "File size: ${FILE_SIZE} bytes"

          if [ "${FILE_SIZE}" -lt 100000 ]; then
            echo "ERROR: recording file is suspiciously small."
            ls -lh recording.mp4 || true
            exit 1
          fi

          echo
          echo "=============================================="
          echo "VIDEO INFORMATION"
          echo "=============================================="

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries \
              stream=codec_name,width,height,r_frame_rate,pix_fmt,duration,bit_rate \
            -of default=noprint_wrappers=1 \
            recording.mp4 || true

          echo
          echo "Final file:"
          ls -lh recording.mp4

          echo
          echo "Recording finalized."

      - name: Upload Recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saas-demo-recording
          path: recording.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saas-demo-logs
          path: |
            /tmp/xvfb.log
            /tmp/chromium.log
            /tmp/x11vnc.log
            /tmp/novnc.log
            /tmp/cloudflared.log
            /tmp/ffmpeg.log
            /tmp/font-cache.log
            /tmp/remote-info.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo "Cleaning up processes..."

          if [ -f /tmp/ffmpeg.pid ]; then
            kill -INT "$(cat /tmp/ffmpeg.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/cloudflared.pid ]; then
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/novnc.pid ]; then
            kill "$(cat /tmp/novnc.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/x11vnc.pid ]; then
            kill "$(cat /tmp/x11vnc.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/chromium.pid ]; then
            kill "$(cat /tmp/chromium.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/xvfb.pid ]; then
            kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true
          fi

          pkill -f cloudflared 2>/dev/null || true
          pkill -f websockify 2>/dev/null || true
          pkill -f x11vnc 2>/dev/null || true
          pkill -f chromium 2>/dev/null || true
          pkill -f Xvfb 2>/dev/null || true

          echo "Cleanup complete."
