name: Cloud Screen Recorder

# تشغيل الـ Action يدوياً من واجهة GitHub
on:
  workflow_dispatch:

jobs:
  record-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Recording Script
        run: npm run record

      # رفع الفيديو كـ Artifact لتقوم بتحميله
      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: recorded-video-1080p
          path: videos/*.webm
          retention-days: 1
