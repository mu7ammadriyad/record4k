name: Remote SaaS Demo Recorder

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "رابط الموقع الذي سيفتحه Chromium"
        required: true
        default: "https://example.com"

      session_minutes:
        description: "مدة الجلسة والتسجيل بالدقائق"
        required: true
        default: "60"

      width:
        description: "عرض الشاشة"
        required: true
        default: "1920"

      height:
        description: "ارتفاع الشاشة"
        required: true
        default: "1080"

      fps:
        description: "FPS"
        required: true
        default: "60"

permissions:
  contents: read

jobs:
  remote-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      DISPLAY: ":99"
      WIDTH: ${{ inputs.width }}
      HEIGHT: ${{ inputs.height }}
      FPS: ${{ inputs.fps }}
      SITE_URL: ${{ inputs.site_url }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}

    steps:
      - name: Install Everything
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            xdotool \
            x11-utils \
            x11-xserver-utils \
            ffmpeg \
            chromium \
            curl \
            wget \
            openssl \
            ca-certificates

          echo "========================================"
          echo "Installed versions"
          echo "========================================"

          chromium --version
          ffmpeg -version | head -n 1
          x11vnc -version 2>&1 | head -n 1
          websockify --version 2>&1 || true

          test -f /usr/share/novnc/vnc.html

          echo "Everything installed successfully."

      - name: Start Virtual Display
        shell: bash
        run: |
          set -e

          echo "Starting Xvfb..."

          Xvfb "${DISPLAY}" \
            -screen 0 "${WIDTH}x${HEIGHT}x24" \
            -ac \
            +extension GLX \
            +extension RANDR \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          echo $! > /tmp/xvfb.pid

          sleep 3

          DISPLAY="${DISPLAY}" xdpyinfo | grep dimensions
          DISPLAY="${DISPLAY}" xrandr || true

      - name: Start Chromium
        shell: bash
        run: |
          set -e

          rm -rf /tmp/chromium-profile
          mkdir -p /tmp/chromium-profile

          echo "Opening:"
          echo "${SITE_URL}"

          chromium \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-session-crashed-bubble \
            --disable-infobars \
            --disable-translate \
            --no-first-run \
            --no-default-browser-check \
            --disable-features=Translate,MediaRouter \
            --force-device-scale-factor=1 \
            --kiosk \
            --start-fullscreen \
            --window-position=0,0 \
            --window-size="${WIDTH},${HEIGHT}" \
            --user-data-dir=/tmp/chromium-profile \
            "${SITE_URL}" \
            > /tmp/chromium.log 2>&1 &

          echo $! > /tmp/chromium.pid

          echo "Waiting for Chromium..."

          for i in $(seq 1 30); do
            if DISPLAY="${DISPLAY}" xdotool search --onlyvisible --class chromium >/dev/null 2>&1; then
              echo "Chromium window detected."
              break
            fi

            sleep 1
          done

          sleep 8

          DISPLAY="${DISPLAY}" xdotool mousemove 1 1

          echo "Chromium is ready."

      - name: Start VNC Server
        shell: bash
        run: |
          set -e

          VNC_PASSWORD="$(openssl rand -hex 6)"

          mkdir -p "$HOME/.vnc"

          x11vnc \
            -display "${DISPLAY}" \
            -rfbport 5900 \
            -rfbauth "$HOME/.vnc/passwd" \
            -localhost \
            -forever \
            -shared \
            -noxdamage \
            -noxfixes \
            -repeat \
            -noshm \
            -wait 5 \
            -defer 5 \
            > /tmp/x11vnc.log 2>&1 &

          X11VNC_PID=$!

          echo "${X11VNC_PID}" > /tmp/x11vnc.pid

          x11vnc -storepasswd \
            "${VNC_PASSWORD}" \
            "$HOME/.vnc/passwd"

          chmod 600 "$HOME/.vnc/passwd"

          echo "VNC_PASSWORD=${VNC_PASSWORD}" >> "$GITHUB_ENV"

          sleep 5

          if ! kill -0 "${X11VNC_PID}" 2>/dev/null; then
            echo "x11vnc failed."
            cat /tmp/x11vnc.log
            exit 1
          fi

          echo "x11vnc is running."

      - name: Start noVNC
        shell: bash
        run: |
          set -e

          echo "Starting noVNC..."

          nohup websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > /tmp/novnc.log 2>&1 < /dev/null &

          echo $! > /tmp/novnc.pid

          sleep 5

          curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null

          echo "noVNC is ready."

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -e

          echo "Installing cloudflared..."

          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb || sudo apt-get install -f -y

          cloudflared --version

          echo "Starting Cloudflare Quick Tunnel..."

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:6080 \
            > /tmp/cloudflared.log 2>&1 < /dev/null &

          echo $! > /tmp/cloudflared.pid

          echo "Waiting for trycloudflare.com URL..."

          REMOTE_URL=""

          for i in $(seq 1 60); do
            REMOTE_URL="$(
              grep -oE \
                'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log |
                head -n 1 || true
            )"

            if [ -n "${REMOTE_URL}" ]; then
              break
            fi

            sleep 1
          done

          if [ -z "${REMOTE_URL}" ]; then
            echo "Cloudflare tunnel failed."
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo "REMOTE_URL=${REMOTE_URL}" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "REMOTE COMPUTER READY"
          echo "=============================================="
          echo
          echo "Remote URL:"
          echo "${REMOTE_URL}/vnc.html"
          echo
          echo "VNC Password:"
          echo "${VNC_PASSWORD}"
          echo
          echo "Site:"
          echo "${SITE_URL}"
          echo
          echo "Resolution:"
          echo "${WIDTH}x${HEIGHT}"
          echo
          echo "FPS:"
          echo "${FPS}"
          echo
          echo "Session:"
          echo "${SESSION_MINUTES} minutes"
          echo
          echo "=============================================="

          {
            echo "# 🖥️ Remote SaaS Demo Computer"
            echo
            echo "## 🌐 Remote Computer"
            echo
            echo "[Open Remote Computer](${REMOTE_URL}/vnc.html?autoconnect=true&resize=scale&password=${VNC_PASSWORD})"
            echo
            echo "**VNC Password:** \`${VNC_PASSWORD}\`"
            echo
            echo "## 🌐 SaaS Website"
            echo
            echo "${SITE_URL}"
            echo
            echo "## 🖥️ Resolution"
            echo
            echo "${WIDTH} × ${HEIGHT}"
            echo
            echo "## 🎥 Recording"
            echo
            echo "${FPS} FPS"
            echo
            echo "Recording starts automatically."
            echo "Control the virtual computer from the Remote Computer link."
            echo
            echo "## ⏱️ Session"
            echo
            echo "${SESSION_MINUTES} minutes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait Before Recording
        shell: bash
        run: |
          set -e

          echo "Remote computer is ready."
          echo "Giving you 10 seconds to open the remote link..."

          sleep 10

      - name: Start Recording
        shell: bash
        run: |
          set -e

          rm -f recording.mp4

          echo "Starting FFmpeg recording..."

          nohup ffmpeg \
            -hide_banner \
            -loglevel warning \
            -f x11grab \
            -draw_mouse 1 \
            -framerate "${FPS}" \
            -video_size "${WIDTH}x${HEIGHT}" \
            -i "${DISPLAY}.0" \
            -an \
            -c:v libx264 \
            -preset faster \
            -crf 16 \
            -tune animation \
            -pix_fmt yuv420p \
            -movflags +faststart \
            recording.mp4 \
            > /tmp/ffmpeg.log 2>&1 < /dev/null &

          echo $! > /tmp/ffmpeg.pid

          sleep 3

          FFMPEG_PID="$(cat /tmp/ffmpeg.pid)"

          if ! kill -0 "${FFMPEG_PID}" 2>/dev/null; then
            echo "FFmpeg failed to start."
            cat /tmp/ffmpeg.log
            exit 1
          fi

          echo
          echo "=============================================="
          echo "🎥 RECORDING STARTED"
          echo "=============================================="
          echo
          echo "Remote Computer:"
          echo "${REMOTE_URL}/vnc.html?autoconnect=true&resize=scale&password=${VNC_PASSWORD}"
          echo
          echo "Do your demo now."
          echo "Your mouse and keyboard actions will be recorded."
          echo

      - name: Keep Session Alive
        shell: bash
        run: |
          set -e

          MINUTES="${SESSION_MINUTES}"

          if ! [[ "${MINUTES}" =~ ^[0-9]+$ ]]; then
            echo "Invalid session_minutes."
            exit 1
          fi

          TOTAL_SECONDS=$((MINUTES * 60))

          echo "Session active for ${MINUTES} minutes."

          for ((i=1; i<=TOTAL_SECONDS; i++)); do
            sleep 1

            if (( i % 30 == 0 )); then
              REMAINING=$((TOTAL_SECONDS - i))

              echo "Remaining: ${REMAINING} seconds"
            fi
          done

      - name: Stop Recording Cleanly
        if: always()
        shell: bash
        run: |
          set +e

          echo "Stopping FFmpeg..."

          if [ -f /tmp/ffmpeg.pid ]; then
            FFMPEG_PID="$(cat /tmp/ffmpeg.pid)"

            if kill -0 "${FFMPEG_PID}" 2>/dev/null; then
              kill -INT "${FFMPEG_PID}" 2>/dev/null || true

              for i in $(seq 1 30); do
                if ! kill -0 "${FFMPEG_PID}" 2>/dev/null; then
                  break
                fi

                sleep 1
              done

              if kill -0 "${FFMPEG_PID}" 2>/dev/null; then
                kill -TERM "${FFMPEG_PID}" 2>/dev/null || true
                sleep 2
              fi
            fi
          fi

          echo
          echo "FFmpeg stopped."

          if [ -f /tmp/ffmpeg.log ]; then
            echo
            echo "FFmpeg log:"
            tail -n 50 /tmp/ffmpeg.log || true
          fi

          echo
          echo "Checking recording..."

          if [ ! -f recording.mp4 ]; then
            echo "recording.mp4 does not exist."
            exit 1
          fi

          FILE_SIZE="$(stat -c%s recording.mp4 2>/dev/null || echo 0)"

          if [ "${FILE_SIZE}" -lt 100000 ]; then
            echo "Recording file is unexpectedly small."
            ls -lh recording.mp4 || true
            exit 1
          fi

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries \
              stream=codec_name,width,height,r_frame_rate,pix_fmt,duration \
            -of default=noprint_wrappers=1 \
            recording.mp4

          echo
          echo "Final recording:"
          ls -lh recording.mp4

      - name: Upload Recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saas-demo-recording
          path: recording.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saas-demo-logs
          path: |
            /tmp/xvfb.log
            /tmp/chromium.log
            /tmp/x11vnc.log
            /tmp/novnc.log
            /tmp/cloudflared.log
            /tmp/ffmpeg.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          if [ -f /tmp/ffmpeg.pid ]; then
            kill -INT "$(cat /tmp/ffmpeg.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/cloudflared.pid ]; then
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/novnc.pid ]; then
            kill "$(cat /tmp/novnc.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/x11vnc.pid ]; then
            kill "$(cat /tmp/x11vnc.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/chromium.pid ]; then
            kill "$(cat /tmp/chromium.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/xvfb.pid ]; then
            kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true
          fi

          pkill -f chromium 2>/dev/null || true
          pkill -f cloudflared 2>/dev/null || true
          pkill -f websockify 2>/dev/null || true
          pkill -f x11vnc 2>/dev/null || true
          pkill -f Xvfb 2>/dev/null || true

          echo "Cleanup complete."
