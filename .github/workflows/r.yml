name: Professional SaaS Screen Recorder

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "رابط الموقع الذي سيتم تسجيله"
        required: true
        default: "https://example.com"
      width:
        description: "عرض الفيديو"
        required: true
        default: "1920"
      height:
        description: "ارتفاع الفيديو"
        required: true
        default: "1080"
      fps:
        description: "عدد الإطارات في الثانية"
        required: true
        default: "60"

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      DISPLAY: ":99"
      WIDTH: ${{ inputs.width }}
      HEIGHT: ${{ inputs.height }}
      FPS: ${{ inputs.fps }}
      SITE_URL: ${{ inputs.site_url }}

    steps:
      - name: Install Recording Stack
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            xdotool \
            x11-utils \
            x11-xserver-utils \
            ffmpeg \
            chromium \
            fonts-liberation \
            fonts-noto-color-emoji \
            ca-certificates

          echo "Installed:"
          chromium --version
          ffmpeg -version | head -n 1
          Xvfb -help >/dev/null 2>&1 || true
          xdotool --version

      - name: Start Virtual Screen
        shell: bash
        run: |
          set -e

          echo "Starting Xvfb on ${DISPLAY}..."
          Xvfb "${DISPLAY}" \
            -screen 0 "${WIDTH}x${HEIGHT}x24" \
            -ac \
            +extension GLX \
            +extension RANDR \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          XVFB_PID=$!
          echo "${XVFB_PID}" > /tmp/xvfb.pid

          sleep 3

          DISPLAY="${DISPLAY}" xdpyinfo | grep -E "dimensions|depth of root"
          DISPLAY="${DISPLAY}" xrandr || true

      - name: Prepare Chromium Profile
        shell: bash
        run: |
          set -e

          rm -rf /tmp/chromium-profile
          mkdir -p /tmp/chromium-profile

      - name: Start Chromium Fullscreen
        shell: bash
        run: |
          set -e

          echo "Opening: ${SITE_URL}"

          chromium \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-session-crashed-bubble \
            --disable-infobars \
            --disable-translate \
            --no-first-run \
            --no-default-browser-check \
            --disable-features=Translate,MediaRouter \
            --force-device-scale-factor=1 \
            --kiosk \
            --start-fullscreen \
            --window-position=0,0 \
            --window-size="${WIDTH},${HEIGHT}" \
            --user-data-dir=/tmp/chromium-profile \
            "${SITE_URL}" \
            > /tmp/chromium.log 2>&1 &

          CHROMIUM_PID=$!
          echo "${CHROMIUM_PID}" > /tmp/chromium.pid

          echo "Waiting for Chromium..."

          for i in $(seq 1 30); do
            if DISPLAY="${DISPLAY}" xdotool search --onlyvisible --class chromium >/dev/null 2>&1; then
              echo "Chromium window detected."
              break
            fi

            sleep 1
          done

          sleep 8

          DISPLAY="${DISPLAY}" xdotool mousemove 1 1

          echo "Chromium ready."

      - name: Verify Recording Geometry
        shell: bash
        run: |
          set -e

          echo "Display: ${DISPLAY}"
          echo "Resolution: ${WIDTH}x${HEIGHT}"
          echo "FPS: ${FPS}"

          DISPLAY="${DISPLAY}" xdpyinfo | grep dimensions

          echo "Chromium windows:"
          DISPLAY="${DISPLAY}" xdotool search --onlyvisible --class chromium getwindowname %@ || true

      - name: Start FFmpeg Recording
        shell: bash
        run: |
          set -e

          rm -f recording.mp4

          echo "Starting high-quality recording..."

          ffmpeg \
            -hide_banner \
            -loglevel warning \
            -f x11grab \
            -draw_mouse 1 \
            -framerate "${FPS}" \
            -video_size "${WIDTH}x${HEIGHT}" \
            -i "${DISPLAY}.0" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 16 \
            -tune animation \
            -pix_fmt yuv420p \
            -movflags +faststart \
            recording.mp4 \
            > /tmp/ffmpeg.log 2>&1 &

          FFMPEG_PID=$!
          echo "${FFMPEG_PID}" > /tmp/ffmpeg.pid

          sleep 3

          if ! kill -0 "${FFMPEG_PID}" 2>/dev/null; then
            echo "FFmpeg failed to start."
            cat /tmp/ffmpeg.log
            exit 1
          fi

          echo "Recording started."

      - name: Run SaaS Demo
        shell: bash
        run: |
          set -e

          export DISPLAY="${DISPLAY}"

          echo "Starting demo sequence..."

          # ============================================================
          # 🎬 EDIT YOUR DEMO HERE
          # ============================================================
          #
          # Coordinates are based on your selected resolution.
          #
          # Example:
          #   mousemove X Y
          #   sleep SECONDS
          #   click 1
          #
          # Mouse button:
          #   1 = left
          #   2 = middle
          #   3 = right
          #
          # Keyboard:
          #   key ENTER
          #   key TAB
          #   key ESC
          #   key CTRL+A
          #
          # Scroll:
          #   click 4 = scroll up
          #   click 5 = scroll down
          #
          # ============================================================

          # Move into the page
          xdotool mousemove --sync 960 540
          sleep 2

          # Hover
          xdotool mousemove --sync 700 400
          sleep 2

          # Example click
          xdotool click 1
          sleep 2

          # Example move
          xdotool mousemove --sync 1100 400
          sleep 1

          # Example second click
          xdotool click 1
          sleep 3

          # Example smooth-ish scroll sequence
          xdotool mousemove --sync 1200 850
          sleep 1

          xdotool click 5
          sleep 0.35
          xdotool click 5
          sleep 0.35
          xdotool click 5
          sleep 0.35
          xdotool click 5
          sleep 1.5

          # Move somewhere else
          xdotool mousemove --sync 500 350
          sleep 2

          # ============================================================
          # END DEMO
          # ============================================================

          echo "Demo sequence finished."

          # Give animations/transitions time to finish.
          sleep 3

      - name: Stop Recording
        shell: bash
        run: |
          set -e

          if [ -f /tmp/ffmpeg.pid ]; then
            FFMPEG_PID="$(cat /tmp/ffmpeg.pid)"

            if kill -0 "${FFMPEG_PID}" 2>/dev/null; then
              echo "Stopping FFmpeg..."
              kill -INT "${FFMPEG_PID}" || true
              wait "${FFMPEG_PID}" || true
            fi
          fi

          echo
          echo "Recording finished."

          if [ ! -f recording.mp4 ]; then
            echo "recording.mp4 was not created."
            cat /tmp/ffmpeg.log || true
            exit 1
          fi

          echo
          echo "Video information:"
          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,codec_name,pix_fmt \
            -of default=noprint_wrappers=1 \
            recording.mp4

          echo
          echo "File size:"
          ls -lh recording.mp4

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: saas-demo-recording
          path: recording.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saas-demo-logs
          path: |
            /tmp/xvfb.log
            /tmp/chromium.log
            /tmp/ffmpeg.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          if [ -f /tmp/ffmpeg.pid ]; then
            kill -INT "$(cat /tmp/ffmpeg.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/chromium.pid ]; then
            kill "$(cat /tmp/chromium.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/xvfb.pid ]; then
            kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true
          fi

          pkill -f chromium 2>/dev/null || true
          pkill -f Xvfb 2>/dev/null || true

          echo "Cleanup complete."
